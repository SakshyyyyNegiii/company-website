    <script>
      // Smart WebSocket Manager & Error Suppressor
      (function() {
        'use strict';
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        function MockWebSocket(url, protocols) {
          var self = this;
          self.url = String(url || '');
          self.protocol = Array.isArray(protocols) ? (protocols[0] || '') : String(protocols || '');
          self.readyState = 0; // CONNECTING
          self.bufferedAmount = 0;
          self.extensions = '';
          self.binaryType = 'blob';

          self.onopen = null;
          self.onmessage = null;
          self.onerror = null;
          self.onclose = null;

          var listeners = { open: [], message: [], error: [], close: [] };

          self.addEventListener = function(type, listener, options) {
            if (typeof listener !== 'function') return;
            if (!listeners[type]) listeners[type] = [];
            var once = options && typeof options === 'object' ? Boolean(options.once) : false;
            listeners[type].push({ listener: listener, once: once });
          };

          self.removeEventListener = function(type, listener) {
            if (!listeners[type]) return;
            listeners[type] = listeners[type].filter(function(entry) {
              return entry.listener !== listener;
            });
          };

          self.dispatchEvent = function(evt) {
            var type = evt && evt.type;
            if (!type) return true;
            try {
              Object.defineProperty(evt, 'target', { value: self, configurable: true });
              Object.defineProperty(evt, 'currentTarget', { value: self, configurable: true });
            } catch (e) {}

            var list = (listeners[type] || []).slice();
            for (var i = 0; i < list.length; i++) {
              try { list[i].listener.call(self, evt); } catch (err) {}
              if (list[i].once) self.removeEventListener(type, list[i].listener);
            }

            var handler = self['on' + type];
            if (typeof handler === 'function') {
              try { handler.call(self, evt); } catch (err) {}
            }
            return true;
          };

          function makeEvt(type, extra) {
            var evt;
            try {
              if (type === 'message') {
                evt = new MessageEvent('message', { data: extra && extra.data, origin: self.url });
              } else if (type === 'close') {
                evt = new CloseEvent('close', {
                  code: (extra && extra.code) || 1000,
                  reason: (extra && extra.reason) || '',
                  wasClean: true
                });
              } else {
                evt = new Event(type);
              }
            } catch (e) {
              try {
                evt = document.createEvent('Event');
                evt.initEvent(type, false, false);
                if (extra) { for (var k in extra) { evt[k] = extra[k]; } }
              } catch (ex) {
                evt = { type: type, target: self, currentTarget: self };
              }
            }
            return evt;
          }

          self.send = function(data) {
            if (typeof data === 'string' && data.includes('"ping"')) {
              setTimeout(function() {
                if (self.readyState === 1) {
                  self.dispatchEvent(makeEvt('message', { data: JSON.stringify({ type: 'pong' }) }));
                }
              }, 10);
            }
          };

          self.close = function(code, reason) {
            if (self.readyState === 2 || self.readyState === 3) return;
            self.readyState = 2; // CLOSING
            setTimeout(function() {
              self.readyState = 3; // CLOSED
              self.dispatchEvent(makeEvt('close', { code: code || 1000, reason: reason || 'Normal Closure' }));
            }, 0);
          };

          // Immediately transition to OPEN and broadcast connected state
          setTimeout(function() {
            if (self.readyState === 0) {
              self.readyState = 1; // OPEN
              self.dispatchEvent(makeEvt('open'));
              // Send Vite / HMR connected acknowledgement so Vite never stalls in 'connecting...'
              self.dispatchEvent(makeEvt('message', { data: JSON.stringify({ type: 'connected' }) }));
            }
          }, 0);
        }

        MockWebSocket.CONNECTING = 0;
        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSING = 2;
        MockWebSocket.CLOSED = 3;
        MockWebSocket.prototype = Object.create(NativeWebSocket.prototype);
        MockWebSocket.prototype.constructor = MockWebSocket;
        MockWebSocket.prototype.CONNECTING = 0;
        MockWebSocket.prototype.OPEN = 1;
        MockWebSocket.prototype.CLOSING = 2;
        MockWebSocket.prototype.CLOSED = 3;

        // Smart WebSocket router: routes restricted Vite ports (24678) and HMR ping loops to mock,
        // while allowing real application endpoints (/ws) to connect to native backend sockets
        function SmartWebSocket(url, protocols) {
          var u = String(url || '');
          var p = Array.isArray(protocols) ? (protocols[0] || '') : String(protocols || '');

          if (
            u.includes('24678') ||
            p.includes('vite-') ||
            p === 'vite-ping' ||
            p === 'vite-hmr' ||
            (u.includes('token=') && !u.includes('/ws'))
          ) {
            return new MockWebSocket(url, protocols);
          }

          try {
            return new NativeWebSocket(url, protocols);
          } catch (e) {
            return new MockWebSocket(url, protocols);
          }
        }

        SmartWebSocket.CONNECTING = 0;
        SmartWebSocket.OPEN = 1;
        SmartWebSocket.CLOSING = 2;
        SmartWebSocket.CLOSED = 3;
        SmartWebSocket.prototype = NativeWebSocket.prototype;
        SmartWebSocket.toString = function() { return 'function WebSocket() { [native code] }'; };

        window.WebSocket = SmartWebSocket;
        if (typeof globalThis !== 'undefined') {
          globalThis.WebSocket = SmartWebSocket;
        }

        // Intercept console.error & console.warn to suppress any lingering socket errors
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.join(' ');
          if (joined.toLowerCase().includes('websocket') || joined.includes('wss://') || joined.includes('ws://') || joined.includes('vite:ws')) {
            return;
          }
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.join(' ');
          if (joined.toLowerCase().includes('websocket') || joined.includes('wss://') || joined.includes('ws://') || joined.includes('vite:ws')) {
            return;
          }
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.toLowerCase().includes('websocket') || msg.toLowerCase().includes('ws://') || msg.toLowerCase().includes('wss://'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (e && e.target && (e.target instanceof MockWebSocket || (NativeWebSocket && e.target instanceof NativeWebSocket))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var str = String((e && e.reason) || '').toLowerCase();
          if (str.includes('websocket') || str.includes('ws://') || str.includes('wss://')) {
            e.preventDefault();
          }
        });
      })();
    </script>
