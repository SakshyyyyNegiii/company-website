    <script>
      // Gracefully handle any transient dev-server WebSocket handshake issues in sandboxed iframes
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('websocket'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).toLowerCase().includes('websocket')) {
          e.preventDefault();
        }
      });
    </script>
